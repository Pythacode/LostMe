<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <div id="opencollection-container"></div>
    <script>
        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: LostMe\nconfig:\n  proxy:\n    inherit: true\n    config:\n      protocol: http\n      hostname: ''\n      port: ''\n      auth:\n        username: ''\n        password: ''\n      bypassProxy: ''\n  environments:\n    - name: exemple\n      variables:\n        - name: bearer_token\n          value: YOUR TOKEN HERE\n          description: Your Token\n        - name: baseUrl\n          value: https://lostme.nathanaelle.org/api/v0\n          description: Base URL of API\nitems:\n  - info:\n      name: Send message\n      type: http\n      seq: 1\n    http:\n      method: POST\n      url: '{{baseUrl}}/send_message.php?msg=string&looser=Nath'\n      params:\n        - name: msg\n          value: string\n          type: query\n        - name: looser\n          value: Nath\n          type: query\n      body:\n        type: json\n        data: ''\n      auth: inherit\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n      forwardAuthorizationHeader: false\n    docs: |-\n      This endpoint is for sending a message.<br>\n      It costs 1 credit.\n    examples:\n      - name: simple-example\n        description: A simple exemple\n        request:\n          url: '{{baseUrl}}/send_message.php?msg=Je veux tous vous faire perdre <3'\n          method: POST\n          params:\n            - name: msg\n              value: Je veux tous vous faire perdre <3\n              type: query\n          body:\n            type: json\n            data: ''\n        response:\n          status: 200\n          statusText: OK\n          headers:\n            - name: Content-Type\n              value: application/json\n          body:\n            type: text\n            data: |-\n              {\n                \"response\": \"Messages send !\"\n              }\n      - name: with-looser-example\n        description: A exemple with a loser\n        request:\n          url: '{{baseUrl}}/send_message.php?msg=You lose&looser=Nath'\n          method: POST\n          params:\n            - name: msg\n              value: You lose\n              type: query\n            - name: looser\n              value: Nath\n              type: query\n          body:\n            type: json\n            data: ''\n        response:\n          status: 200\n          statusText: OK\n          headers:\n            - name: Content-Type\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"response\": \"Messages send !\"\n              }\n  - info:\n      name: Get users\n      type: http\n      seq: 2\n    http:\n      method: GET\n      url: '{{baseUrl}}/get_users.php'\n      auth: inherit\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n      forwardAuthorizationHeader: false\n    docs: |-\n      This Entrypoint retrun a json list of user.\\\n      It cost 0 credits\n    examples:\n      - name: simple-example\n        request:\n          url: '{{baseUrl}}/get_users.php'\n          method: GET\n        response:\n          status: 200\n          statusText: OK\n          headers:\n            - name: Content-Type\n              value: application/json\n          body:\n            type: json\n            data: |-\n              [\n                \"Nath\",\n                \"Toto\",\n                \"Pluton\"\n              ]\nrequest:\n  auth:\n    type: bearer\n    token: '{{bearer_token}}'\ndocs:\n  content: |-\n    # LostMe API\n\n    This API allows you to send messages to LostMe users.\n\n    You have 10 credits per 24-hour sliding window.\n\n    This API is completly Free\n\n    ## How have a token\n\n    1. [Sign up](https://lostme.nathanaelle.org/become-a-loser) on LostMe\n    2. Go get you'r token on [API Dashbord](https://lostme.nathanaelle.org/api-publique)\n    3. Enjoy !\n\n    ## Contact\n\n    [contact@nathanaelle.org](mailto:contact@nathanaelle.org)\n\n    ## Open source\n\n    This project is full open source : [Pythacode/lostme](https://github.com/Pythacode/LostMe/)\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n    presets:\n      requestType: http\n      requestUrl: '{{baseUrl}}'\n      defaultEnvironment: main\n    exportedAt: '2026-10-16T20:59:14.131Z'\n    exportedUsing: Bruno/4.2.1\n";
        new window.OpenCollection({
            target: document.getElementById('opencollection-container'),
            opencollection: collectionData,
            theme: 'light'
        });
    </script>
</body>
</html>
